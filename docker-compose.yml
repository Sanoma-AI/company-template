# Postgres for DBOS, the workflow runtime. Local development only.
# Port 5434, so it does not clash with another Postgres on the default 5432.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: dbos
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15
